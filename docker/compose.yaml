services:
  scheduled-report-aggregator:
    container_name: scheduled-report-aggregator
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_TAG: v3.0.1
        GIT_REPO: https://github.com/AetherBreaker/ScheduledReportAggregator.git
    restart: no
    volumes:
      - type: bind
        source: /data/reports_processing_files
        target: /app/persisted_data
    environment:
      - ALERTS_EMAIL=info@sweetfiretobacco.com
      - ALERTS_EMAIL_PWD=${ALERTS_EMAIL_PWD:?}
      - ALERTS_RECIPIENTS=["jacob.ogden@sweetfiretobacco.com"]
      - HEARTBEAT_SLUG=scheduled-report-aggregator
      - WG_PRIVATE_KEY=${WG_PRIVATE_KEY:?}
      - WG_HUB_URL=${WG_HUB_URL:?}
      - WG_HUB_REPO=${WG_HUB_REPO:?}
      - WG_HUB_TOKEN=${WG_HUB_TOKEN:-}
    networks:
      - coolify
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/devkit-container
        - healthcheck
        - --file
        - /app/persisted_data/logs/heartbeat.txt
        - --file
        - /app/persisted_data/logs/wireguard-heartbeat.txt
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    cap_add:
      - NET_ADMIN

networks:
  coolify:
    external: true
